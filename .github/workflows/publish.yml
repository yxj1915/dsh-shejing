name: Publish

# 用 **trusted publishing (OIDC)** 发布——不带任何长期密钥。
#
# 为什么不用 token：npm 已在 2026 年 8 月限制带 bypass-2FA 的 granular token 做账号
# 与包管理操作，并计划于 2027 年 1 月取消它「直接发布」的能力，改成「暂存 + 人工
# 2FA 批准」。官方给的正路就是 OIDC 或 staged publishing。
#   https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
#
# 首次使用前，要在 npmjs.com 上为该包配置 trusted publisher：
#   Package → Settings → Trusted publishing → 添加 GitHub 仓库
#     组织/用户：yxj1915
#     仓库：dsh-shejing
#     Workflow 文件名：publish.yml
#     环境：release（可选，填了就要与本文件的 environment 一致）
#
# 发布前请先手动跑过 docs/PUBLISHING.md 里的三道闸：
#   1. node scripts/test.mjs
#   2. node scripts/regression.mjs <克隆批次>
#   3. node scripts/test-packed-install.mjs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: read
  id-token: write # OIDC 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC 需要较新的 npm（11.5+）才认得上游的 id-token。
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 发布前跑一遍可离线验证的测试
        env:
          DSH_HOME: ${{ runner.temp }}/shejing-home
        run: |
          mkdir -p "$DSH_HOME"
          node scripts/test.mjs

      - name: 确保浏览器半边是最新构建
        run: node scripts/build-client.mjs

      - name: 检查工作树没有被构建改脏
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "构建产物与提交内容不一致——请先本地跑 build-client.mjs 并提交" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: 发布到 npm（OIDC，无长期密钥）
        run: npm publish --tag "${{ github.event.inputs.tag || 'latest' }}"
